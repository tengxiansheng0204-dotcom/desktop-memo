name: Capture macOS beta screenshots

on:
  push:
    branches: [preview/macos-screenshots]
    paths:
      - .github/workflows/capture-macos.yml
      - scripts/capture-macos.sh
      - scripts/window-id.swift

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run released app and capture native window
        run: bash scripts/capture-macos.sh
      - name: Save actual window screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macOS-runtime-screenshots
          path: screenshot-output/
          if-no-files-found: error
          retention-days: 14
